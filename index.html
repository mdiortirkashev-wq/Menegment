<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madrasa CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M2 7l10 5 10-5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 12v10" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">Madrasa</span>
        <span class="logo-sub">CRM tizimi</span>
      </div>
    </div>

    <div class="sidebar-section-label">ASOSIY</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="home">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        Bosh sahifa
      </a>
      <a href="#" class="nav-item" data-page="students">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Talabalar
      </a>
      <a href="#" class="nav-item" data-page="classes">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        Sinflar
      </a>
      <a href="#" class="nav-item" data-page="subjects">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Fanlar
      </a>
    </nav>

    <div class="sidebar-section-label">TA'LIM</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item" data-page="schedule">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Dars jadvali
      </a>
      <a href="#" class="nav-item" data-page="attendance">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Davomat
      </a>
      <a href="#" class="nav-item" data-page="grades">
        <svg class="nav-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Baholar
      </a>
      <a href="#" class="nav-item" data-page="ethics">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        Axloq
      </a>
    </nav>

    <div class="sidebar-section-label">MOLIYA & TURAR JOY</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item" data-page="payments">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        To'lovlar
      </a>
      <a href="#" class="nav-item" data-page="dormitory">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 22V7l9-5 9 5v15"/><path d="M9 22V12h6v10"/><rect x="3" y="11" width="4" height="4"/><rect x="17" y="11" width="4" height="4"/></svg>
        Yotoqxona
      </a>
    </nav>

    <div class="sidebar-section-label">BOSHQARUV</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item" data-page="notifications">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        Bildirishnomalar
        <span class="nav-badge" id="notif-badge">4</span>
      </a>
      <a href="#" class="nav-item" data-page="reports">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
        Hisobotlar
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-avatar">DM</div>
      <div class="user-info">
        <span class="user-name">Direktor</span>
        <span class="user-role">Admin</span>
      </div>
      <button class="logout-btn" title="Chiqish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrap">

    <!-- TOPBAR -->
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Menyu">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title" id="topbar-title">Bosh sahifa</div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Qidiruv..." id="search-input" />
        </div>
        <button class="topbar-icon-btn" id="notif-btn" aria-label="Bildirishnomalar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="topbar-badge">4</span>
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content" id="page-content">
      <!-- JS tomonidan to'ldiriladi -->
    </main>

  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
